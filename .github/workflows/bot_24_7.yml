name: POCO AI Bot 24/7

# Один бот за раз: новый запуск сам останавливает старый.
concurrency:
  group: poco-ai-bot
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # перезапуск каждые 5 часов — лимит одного job 6 часов
    - cron: '0 */5 * * *'

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import aiogram; print('aiogram', aiogram.__version__)"

      - name: Run POCO AI Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TOKEN }}
          DAVINCI_TOKEN: ${{ secrets.DAVINCI_TOKEN || secrets.TOKEN2 }}
          DAVINCI_REFRESH_TOKEN: ${{ secrets.DAVINCI_REFRESH_TOKEN || secrets.TOKEN3 }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || secrets.TOKEN4 }}
          KEY_SIGNING_SECRET: ${{ secrets.KEY_SIGNING_SECRET || secrets.ADMIN_PASSWORD || secrets.TOKEN4 }}
          API_PASSWORD: ${{ secrets.API_PASSWORD || secrets.TOKEN5 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PYTHONUNBUFFERED: "1"
        run: python bot.py
