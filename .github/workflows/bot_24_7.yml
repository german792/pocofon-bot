name: POCO AI Bot 24/7

concurrency:
  group: poco-ai-bot
  # push / ручной запуск сразу заменяют работающего бота новой версией,
  # а плановые запуски встают в очередь и стартуют, как только текущий прогон закончится
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # Каждый час в очередь ставится запасной запуск: он ждёт, пока текущий
    # прогон упрётся в лимит времени, и сразу подхватывает бота. Если GitHub
    # пропустит один плановый запуск, через час будет следующий.
    - cron: '17 * * * *'

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up FFmpeg (static build, fast)
        uses: FedericoCarboni/setup-ffmpeg@v3
        continue-on-error: true
        id: setup-ffmpeg

      - name: Install dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          pip install -r requirements.txt

      - name: Run POCO AI Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TOKEN }}
          DAVINCI_TOKEN: ${{ secrets.DAVINCI_TOKEN || secrets.TOKEN2 }}
          DAVINCI_REFRESH_TOKEN: ${{ secrets.DAVINCI_REFRESH_TOKEN || secrets.TOKEN3 }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || secrets.TOKEN4 }}
          KEY_SIGNING_SECRET: ${{ secrets.KEY_SIGNING_SECRET || secrets.ADMIN_PASSWORD || secrets.TOKEN4 }}
          API_PASSWORD: ${{ secrets.API_PASSWORD || secrets.TOKEN5 }}
        run: |
          python bot.py
