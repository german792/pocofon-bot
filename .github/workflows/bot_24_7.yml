name: POCO AI Bot 24/7

# Один бот за раз: новый запуск сам останавливает старый.
concurrency:
  group: poco-ai-bot
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # перезапуск каждые 5 часов — лимит одного job 6 часов
    - cron: '0 */5 * * *'

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            curl -fsSL --retry 2 --max-time 60 \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              | tar -xJ --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            sudo mv ffmpeg ffprobe /usr/local/bin/
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import aiogram; print('aiogram', aiogram.__version__)"

      - name: Run POCO AI Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TOKEN }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          LOREMOTION_TOKEN: ${{ secrets.LOREMOTION_TOKEN }}
          LOREMOTION_REFRESH_TOKEN: ${{ secrets.LOREMOTION_REFRESH_TOKEN }}
          GENCPU_TOKEN: ${{ secrets.GENCPU_TOKEN }}
          GENCPU_EMAIL: ${{ secrets.GENCPU_EMAIL }}
          GENCPU_PASSWORD: ${{ secrets.GENCPU_PASSWORD }}
          DAVINCI_TOKEN: ${{ secrets.DAVINCI_TOKEN || secrets.TOKEN2 }}
          DAVINCI_REFRESH_TOKEN: ${{ secrets.DAVINCI_REFRESH_TOKEN || secrets.TOKEN3 }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || secrets.TOKEN4 }}
          KEY_SIGNING_SECRET: ${{ secrets.KEY_SIGNING_SECRET || secrets.ADMIN_PASSWORD || secrets.TOKEN4 }}
          API_PASSWORD: ${{ secrets.API_PASSWORD || secrets.TOKEN5 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PYTHONUNBUFFERED: "1"
        run: python bot.py
