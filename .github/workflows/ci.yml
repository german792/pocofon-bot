name: CI

on:
  pull_request:
  push:
    branches-ignore: [ main, master ]   # на main и так запускается бот

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Syntax check
        run: python -m compileall -q .

      - name: Lint (только реальные ошибки)
        run: ruff check . --select E9,F63,F7,F82 --exclude .git

      - name: Import smoke test
        env:
          BOT_TOKEN: "123456:TEST"
        run: python -c "import config, bot, queue_worker; print('imports ok')"
